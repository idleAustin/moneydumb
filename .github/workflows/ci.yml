name: CI Validation & Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history and tags required for versioning

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Dead Code & Dependency Check (Knip)
        run: npm run knip

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Production Bundle
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: |
            .next/standalone/
            .next/static/
            public/
          retention-days: 1

  deploy-staging:
    name: Deploy to Staging
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Production Bundle
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # Deploys PR build to the staging environment using Doppler 'stg' environment token.
      # Does NOT cut a version tag.
      - name: Deploy Application (Staging)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_STG || secrets.DOPPLER_TOKEN }}
        run: |
          # Option A: GCP Cloud Run Staging
          # doppler --no-check-version run -- gcloud run deploy money-dumb-staging --source . --region us-central1
          # Option B: Cloudflare Workers Staging
          # doppler --no-check-version run -- npx --yes wrangler deploy --env staging
          echo "Deploying staging preview with secrets from Doppler (stg)..."

  deploy:
    name: Deploy to Production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Production Bundle
        uses: actions/download-artifact@v4
        with:
          name: next-standalone
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      # Secrets are injected directly from Doppler via DOPPLER_TOKEN (prd)
      - name: Deploy Application (Production)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          # Option A: GCP Cloud Run Production
          # doppler --no-check-version run -- gcloud run deploy money-dumb --source . --region us-central1
          # Option B: Cloudflare Workers Production
          # doppler --no-check-version run -- npx --yes wrangler deploy
          echo "Deploying production release with secrets from Doppler (prd)..."

      # Tags the version worked out from conventional commits and publishes GitHub release notes
      - name: Tag Release & Publish Notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node scripts/version.mjs --notes notes.md)"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "$VERSION already released; deployed commit ${GITHUB_SHA::7}."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md

